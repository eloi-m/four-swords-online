# Four Swords Online under /fso/ of an existing nginx server block (docs/deploy.md "Under a sub-path of an existing
# nginx"): include this file inside the server block, e.g. as /etc/nginx/default.d/fso.conf. Behind a proxy or CDN that
# terminates TLS, set `absolute_redirect off` in the server block so redirects stay relative. Paths (change them to
# yours):
#   /srv/www/fso/      the site, built with BASE=/fso/ (apps/site/dist)
#   /srv/fso-data/     the game files and manifest.json (pnpm bundle's out/fso-data); nginx needs read on the files
#   127.0.0.1:5185     the lobby (node tools/signal, or deploy/signal.Dockerfile)
# Every response says `private`: a CDN in front must never cache the game files.

location = /fso { return 301 /fso/; }

location /fso/ {
    root /srv/www;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Pages revalidate, so a deploy shows at once; they then load the new hashed assets.
    add_header Cache-Control "private, no-cache" always;
    # A missing file must not be cached for a year under an immutable name.
    error_page 404 @fso_missing;

    # Every file name here carries a content hash.
    location /fso/assets/ {
        add_header Cache-Control "private, max-age=31536000, immutable" always;
    }

    # The game files: the pages add the manifest's content hash (?v=), so a changed file gets a new URL.
    location /fso/data/ {
        alias /srv/fso-data/;
        # The game files are served as application/octet-stream; gzip takes the ~41 MB to ~31 MB (the pages check
        # the decoded size against the manifest). Immutable, so each browser downloads (and nginx compresses) once.
        gzip_types application/octet-stream application/json;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
    }
    location = /fso/data/manifest.json {
        alias /srv/fso-data/manifest.json;
        add_header Cache-Control "private, no-cache" always;
    }
}

location @fso_missing {
    add_header Cache-Control "private, no-store" always;
    return 404;
}

# The lobby's WebSocket. The lobby checks the page's Origin.
location = /fso/signal {
    proxy_pass http://127.0.0.1:5185/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # The visitor's address for the lobby's per-address caps (TRUST_PROXY=1: it takes the last address). Behind
    # Cloudflare, use $http_cf_connecting_ip instead: the last address would be Cloudflare's edge.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Above the lobby's 20 s ping; a match can last a while.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    add_header Cache-Control "private, no-store" always;
}
