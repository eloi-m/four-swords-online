<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>Four Swords Online</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="hud"></div>
    <div id="banner" hidden></div>
    <div id="audio" class="audio" hidden>
      <button id="mute" type="button" title="Mute (M)">Sound on</button>
      <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume" />
    </div>
    <div id="boot">
      <h1>Four Swords Online</h1>
      <p id="boot-status">Loading…</p>
      <progress id="progress" max="1" value="0" hidden></progress>
    </div>
    <dialog id="stages" aria-label="Stages">
      <header><h1>Hyrulean Adventure</h1><button id="stages-close" type="button" aria-label="Close">×</button></header>
      <div id="stage-list"></div>
    </dialog>
    <div id="end" hidden>
      <h1>World 1 cleared</h1>
      <table id="end-gems"></table>
      <p><button id="end-again" type="button">Play again</button> <button id="end-stages" type="button">Stage list</button></p>
    </div>
    <div id="rotate" class="rotate">
      <div class="phone" aria-hidden="true"></div>
      <p><strong>Turn your phone sideways</strong></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
